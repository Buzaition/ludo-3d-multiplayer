<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ludo 3D — Analytics</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b0f15;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#16243a 0,transparent 36%),#0b0f15;padding:28px}.wrap{max-width:1100px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:28px}.head p{margin:5px 0 0;color:#95a1b2}.key{display:flex;gap:8px}.key input,.key button{border:1px solid #283241;border-radius:11px;background:#111722;color:#fff;padding:9px 11px}.key button{background:#fff;color:#111;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #222c39;border-radius:17px;background:linear-gradient(145deg,#131a24,#0e141c);padding:16px}.metric small{color:#8d99aa}.metric strong{display:block;margin-top:7px;font-size:28px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.bar-row{display:grid;grid-template-columns:120px 1fr 55px;align-items:center;gap:8px;margin:10px 0;font-size:12px}.track{height:9px;border-radius:99px;background:#202a36;overflow:hidden}.track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#e3b54b,#ffd978)}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid #222c39;text-align:right;color:#c8d0dc}th{color:#7f8b9c}.muted{color:#7f8b9c;font-size:11px}@media(max-width:800px){body{padding:14px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.head{display:block}.key{margin-top:12px}.bar-row{grid-template-columns:95px 1fr 45px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>Points Validation Analytics</h1><p>إحصائيات تجريبية — لا توجد مدفوعات حقيقية.</p></div><div class="key"><input id="key" placeholder="ADMIN_KEY (اختياري)"/><button id="flush">حفظ GitHub الآن</button><button id="reload">تحديث</button></div></div>
  <div id="status" class="muted">جاري التحميل…</div>
  <div class="grid" id="metrics"></div>
  <div class="two">
    <section class="card"><h3>الباكدجات</h3><div id="packages"></div></section>
    <section class="card"><h3>طرق الدفع</h3><div id="payments"></div></section>
  </div>
  <section class="card" style="margin-top:10px"><h3>آخر الأحداث</h3><div style="overflow:auto"><table><thead><tr><th>الحدث</th><th>Package</th><th>Payment</th><th>الوقت</th></tr></thead><tbody id="events"></tbody></table></div></section>
</div>
<script type="module" src="./admin.js"></script>
</body>
</html>
